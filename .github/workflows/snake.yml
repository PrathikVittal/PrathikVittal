name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: PrathikVittal
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%230D1117,%231E293B,%236366F1,%2338BDF8,%230EA5E9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
